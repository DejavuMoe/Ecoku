name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  frontend:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [client, admin, docs]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify SDK release metadata
        if: matrix.target == 'client'
        run: |
          node scripts/check-release.mjs --self-test
          node scripts/check-release.mjs
      - name: Verify frontend
        if: matrix.target != 'docs'
        env:
          TARGET: ${{ matrix.target }}
        run: pnpm "verify:$TARGET"
      - name: Build and verify documentation
        if: matrix.target == 'docs'
        run: |
          pnpm docs:build
          sh scripts/verify-docs-output.sh docs/.vitepress/dist
      - name: Pack verified SDK
        if: matrix.target == 'client'
        run: |
          mkdir -p artifacts
          cd packages/client
          npm pack --ignore-scripts --pack-destination ../../artifacts
      - name: Save SDK tarball
        if: matrix.target == 'client'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecoku-sdk
          path: artifacts/ecoku-*.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save documentation
        if: matrix.target == 'docs'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecoku-docs
          path: docs/.vitepress/dist
          if-no-files-found: error
          retention-days: 7

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/ecoku-server .
