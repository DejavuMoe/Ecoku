name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Advisory databases change without a commit here. A separate job keeps a new
  # advisory from hiding the build and test results; release still requires it.
  # Advisories without a fix are excepted only in pnpm-workspace.yaml auditConfig.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      # Include build/docs, optional dependencies and standalone design tools.
      - name: Audit JavaScript dependencies
        run: |
          pnpm audit --audit-level=low
          npm --prefix .agents/skills/baoyu-design/agents/gen-pptx audit --audit-level=low
          npm --prefix .agents/skills/baoyu-design/agents/gen-video audit --audit-level=low

  frontend:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Installation is explicit below; nested pnpm scripts must not reinstall all packages.
    env:
      pnpm_config_verify_deps_before_run: 'false'
    strategy:
      fail-fast: false
      matrix:
        target: [client, admin, docs]
        include:
          - target: client
            filter: ./packages/client...
          - target: admin
            filter: ./packages/admin...
          - target: docs
            filter: ./docs...
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install target dependencies
        env:
          FILTER: ${{ matrix.filter }}
        run: pnpm --filter "$FILTER" --fail-if-no-match install --frozen-lockfile --prefer-offline
      - name: Install SDK test browser
        if: matrix.target == 'client'
        run: pnpm -C packages/client exec playwright install --with-deps --only-shell chromium
      - name: Verify SDK browser behavior
        if: matrix.target == 'client'
        run: pnpm -C packages/client run test:browser
      - name: Verify SDK release metadata
        if: matrix.target == 'client'
        run: |
          node scripts/check-ci.mjs
          node scripts/check-release.mjs --self-test
          node scripts/check-release.mjs
          node scripts/pin-docs-sdk.mjs --self-test
          node scripts/pin-docs-sdk.mjs --check
      - name: Verify API smoke script
        if: matrix.target == 'client'
        run: pwsh -NoProfile -File scripts/real-api-smoke.test.ps1
      - name: Verify frontend
        if: matrix.target != 'docs'
        env:
          TARGET: ${{ matrix.target }}
        run: pnpm "verify:$TARGET"
      - name: Verify documentation publisher
        if: matrix.target == 'docs'
        run: sh scripts/test-publish-docs.sh
      - name: Build and verify documentation
        if: matrix.target == 'docs'
        run: |
          pnpm docs:build
          sh scripts/verify-docs-output.sh docs/.vitepress/dist
      - name: Pack verified SDK
        if: matrix.target == 'client'
        run: |
          mkdir -p artifacts
          cd packages/client
          npm pack --ignore-scripts --pack-destination ../../artifacts
          # Package contracts were checked above. Publishing, including dry-run,
          # checks the registry and fails after this version has been released.
      - name: Verify installed SDK
        if: matrix.target == 'client'
        run: sh scripts/test-sdk-consumer.sh artifacts/ecoku-*.tgz
      - name: Save SDK tarball
        if: matrix.target == 'client'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecoku-sdk
          path: artifacts/ecoku-*.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save documentation
        if: matrix.target == 'docs'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecoku-docs
          path: docs/.vitepress/dist
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  sdk-consumer:
    name: SDK consumer (Node ${{ matrix.node }})
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Minimum versions from packages/client/package.json. The client job
        # checks the same tarball on the current build toolchain.
        node: ['20.19.0', '22.12.0', '24.0.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ecoku-sdk
          path: artifacts
      - run: sh scripts/test-sdk-consumer.sh artifacts/ecoku-*.tgz

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Match the production image and share build cache across test/vet/build.
      CGO_ENABLED: '0'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # Keep text output: JSON/SARIF modes do not fail on vulnerability findings.
      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go build -trimpath -ldflags="-s -w" -o /tmp/ecoku-server .
      - name: Race-check shared runtime state
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./adminidentity ./instancekeys ./config ./model ./handle/comment

  image:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build candidate image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ecoku:ci
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Verify fresh image and Alpine upgrade with rollback
        env:
          PREVIOUS_IMAGE: ghcr.io/dejavumoe/ecoku:v0.5.7@sha256:81962c68bf134c0d9fcbc9b5bc0c189b6c886f0f2e5a81fc5fed91b0f8bac847
        run: |
          sh scripts/verify-image.sh ecoku:ci
          docker pull "$PREVIOUS_IMAGE"
          sh scripts/verify-image.sh ecoku:ci "$PREVIOUS_IMAGE"
