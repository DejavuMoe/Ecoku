name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  frontend:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [client, admin, docs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify SDK release metadata
        if: matrix.target == 'client'
        run: |
          node scripts/check-ci.mjs
          node scripts/check-release.mjs --self-test
          node scripts/check-release.mjs
      - name: Verify frontend
        if: matrix.target != 'docs'
        env:
          TARGET: ${{ matrix.target }}
        run: pnpm "verify:$TARGET"
      - name: Build and verify documentation
        if: matrix.target == 'docs'
        run: |
          pnpm docs:build
          sh scripts/verify-docs-output.sh docs/.vitepress/dist
      - name: Pack verified SDK
        if: matrix.target == 'client'
        run: |
          mkdir -p artifacts
          cd packages/client
          npm pack --ignore-scripts --pack-destination ../../artifacts
          # Package contracts were checked above. Publishing, including dry-run,
          # checks the registry and fails after this version has been released.
      - name: Save SDK tarball
        if: matrix.target == 'client'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecoku-sdk
          path: artifacts/ecoku-*.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save documentation
        if: matrix.target == 'docs'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecoku-docs
          path: docs/.vitepress/dist
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Match the production image and share build cache across test/vet/build.
      CGO_ENABLED: '0'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go build -trimpath -ldflags="-s -w" -o /tmp/ecoku-server .
