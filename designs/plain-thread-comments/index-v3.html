<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>纯文本嵌套评论系统原型 · 大规模线程修订版</title>
  <link rel="stylesheet" href="styles-v3.css">
</head>
<body>
  <aside class="preview-controls" aria-label="原型预览控制" data-prototype-only="true">
    <button class="preview-button" id="theme-toggle" type="button" aria-pressed="false">切换深色</button>
    <button class="preview-button" id="service-toggle" type="button" aria-pressed="false">模拟故障</button>
  </aside>

  <main class="page" data-screen-label="纯文本嵌套评论系统">
    <header class="context">
      <p class="context-kicker">文章评论区</p>
      <h1 class="context-title">Windows 11 IoT LTSC 养老指南</h1>
    </header>

    <section class="comment-section" id="comment-section" aria-label="评论区">
      <div class="section-heading">
        <h2 class="section-title" id="comment-count" aria-live="polite">正在加载</h2>
        <div class="sort-picker" id="sort-picker">
          <span>排序</span>
          <button class="sort-trigger" id="sort-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span id="sort-trigger-label">最早评论</span>
            <span class="sort-chevron" aria-hidden="true"></span>
          </button>
          <div class="sort-menu" id="sort-menu" role="listbox" aria-label="评论排序" hidden>
            <button class="sort-option" type="button" role="option" data-sort="newest" aria-selected="false">最新评论</button>
            <button class="sort-option" type="button" role="option" data-sort="oldest" aria-selected="true">最早评论</button>
          </div>
        </div>
      </div>

      <section class="service-error" id="service-error" aria-live="polite" hidden>
        <h3>评论暂时不可用</h3>
        <p>文章内容不受影响，请稍后重试。</p>
        <button class="secondary-button" id="retry-button" type="button">重新加载</button>
      </section>

      <div id="comment-core">
        <form class="composer" id="comment-form" novalidate>
          <div class="identity-grid">
            <label class="field">
              <span class="field-label">昵称</span>
              <input id="nickname" name="nickname" type="text" value="Dejavu Moe" maxlength="32" autocomplete="nickname" required aria-label="昵称">
            </label>
            <label class="field">
              <span class="field-label">邮箱</span>
              <input id="email" name="email" type="email" value="reader@example.test" maxlength="254" autocomplete="email" required aria-label="邮箱">
            </label>
            <label class="field">
              <span class="field-label">网址</span>
              <input id="website" name="website" type="url" placeholder="可选" maxlength="2048" autocomplete="url" aria-label="网址">
            </label>
          </div>

          <label class="message-field">
            <textarea id="comment-input" name="comment" maxlength="1000" placeholder="写下评论（仅支持纯文本）" required aria-label="评论内容"></textarea>
          </label>
          <p class="form-error" id="form-error" role="alert" hidden></p>

          <div class="composer-footer">
            <p class="composer-guidance">纯文本，邮箱不会公开。</p>
            <div class="composer-end">
              <span class="character-count" id="character-count">0/1000</span>
              <button class="primary-button" id="submit-button" type="submit" disabled>发布评论</button>
            </div>
          </div>
        </form>

        <p class="status-line" id="status-line" role="status" aria-live="polite"></p>
        <div class="thread-list" id="thread-list" role="feed" aria-busy="false"></div>
        <button class="load-more" id="load-more" type="button"></button>
      </div>
    </section>
  </main>

  <template id="reply-template">
    <form class="reply-composer" novalidate>
      <p class="reply-heading">回复 <strong data-reply-author></strong></p>
      <textarea maxlength="1000" placeholder="写下回复（仅支持纯文本）" required aria-label="回复内容"></textarea>
      <div class="reply-footer">
        <button class="secondary-button cancel-reply" type="button">取消</button>
        <button class="primary-button submit-reply" type="submit">发布回复</button>
      </div>
    </form>
  </template>

  <script src="fixtures-v3.js"></script>
  <script src="prototype-v3.js"></script>
</body>
</html>
