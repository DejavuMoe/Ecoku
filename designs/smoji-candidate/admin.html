<!doctype html>
<html lang="zh-CN" data-theme="light" data-design-status="approved">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Ecoku Smoji 管理端 · 已批准附加原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-candidate-body">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="admin-header">
    <div class="admin-header-inner">
      <a class="admin-brand" href="index.html"><span class="admin-brand-mark" aria-hidden="true">E</span><strong>Ecoku</strong></a>
      <nav class="admin-nav" aria-label="主导航"><a href="#">评论管理</a><a href="#" aria-current="page">站点管理</a><a href="#">通知设置</a></nav>
      <button class="admin-logout" type="button">退出登录</button>
    </div>
  </header>

  <main class="admin-main" id="main-content">
    <div class="admin-page-heading"><div><h1>编辑站点</h1><p>管理评论区显示和站点通知身份。</p></div><span class="candidate-pill">已批准附加设计</span></div>
    <div class="admin-layout">
      <aside class="admin-sites" aria-label="站点列表">
        <h2>站点</h2>
        <button type="button" aria-selected="true"><strong>Example Blog</strong><small>blog · https://blog.example.test</small></button>
        <button type="button" aria-selected="false"><strong>Example Docs</strong><small>docs · https://docs.example.test</small></button>
      </aside>

      <form class="admin-site-form" novalidate>
        <div class="admin-form-title"><h2>Example Blog</h2><span>所有评论直接发布</span></div>
        <div class="admin-form-row"><label for="site-id">站点 ID</label><input id="site-id" value="blog" readonly></div>
        <div class="admin-form-row"><label for="site-url">站点 URL</label><input id="site-url" type="url" value="https://blog.example.test"></div>
        <div class="admin-form-row"><span>字段要求</span><div class="admin-checks"><label><input type="checkbox" checked>邮箱必填</label><label><input type="checkbox">网站必填</label></div></div>

        <section class="admin-subsection" aria-labelledby="smoji-settings-title">
          <div class="admin-subsection-heading">
            <div><h3 id="smoji-settings-title">表情包</h3><p>为这个站点启用远程 Smoji 清单。</p></div>
            <label class="admin-switch"><input id="smoji-enabled" type="checkbox" checked><span>启用表情包</span></label>
          </div>
          <div class="admin-form-row" id="smoji-url-row">
            <label for="smoji-url">smoji.json URL</label>
            <div class="admin-field-stack">
              <input id="smoji-url" type="url" value="https://cdn.example.test/ecoku/smoji.json" spellcheck="false" aria-describedby="smoji-url-help smoji-privacy-help">
              <p class="admin-field-help" id="smoji-url-help">仅支持 HTTPS 直链。表情包在访客首次打开选择器时加载，不进入 Ecoku 镜像。</p>
              <p class="admin-privacy-help" id="smoji-privacy-help"><strong>隐私提示：</strong>访客浏览器会直接连接该 URL 及同源图片，资源服务可能看到访客 IP 和请求时间。建议使用自己控制的域名。</p>
              <p class="admin-field-error" id="smoji-url-error" role="alert" hidden>请输入不含凭据、查询参数或片段的 HTTPS smoji.json URL。</p>
            </div>
          </div>
        </section>

        <div class="admin-actions"><button type="submit" class="admin-primary">保存站点</button></div>
      </form>
    </div>
  </main>

  <aside class="admin-scenario" data-prototype-only="true" aria-label="原型场景">
    <label for="admin-scenario-select">原型场景</label>
    <select id="admin-scenario-select"><option value="enabled">已启用</option><option value="disabled">未启用</option><option value="invalid">URL 校验错误</option></select>
    <a href="index.html">查看前台选择器</a>
  </aside>
  <script src="prototype.js"></script>
</body>
</html>
