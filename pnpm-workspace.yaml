packages:
  - 'packages/*'
  - 'docs'

allowBuilds:
  esbuild: true

# VitePress 1.6.4 still pins Vite 5; use the patched Vite 6 release until
# VitePress updates its dependency (GHSA-fx2h-pf6j-xcff).
overrides:
  'vitepress@1.6.4>vite': 6.4.6

# Advisories without a patched release. Each entry describes the affected paths
# and why it is not reachable; remove it as soon as a fixed version exists.
auditConfig:
  ignoreGhsas:
    # picomatch <=4.0.7 has no fix. Vite, VitePress, Vitest and svelte-check
    # bring it in for builds and tests. The production graph has no picomatch
    # path, and output inspection found no matcher in the SDK, admin or docs.
    - GHSA-fc5q-39xc-vjpf

# This repository's published SDK is used by the documentation demo.
minimumReleaseAgeExclude:
  - ecoku@0.6.0
