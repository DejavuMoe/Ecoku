labels:
  platform: linux/amd64
  backend: docker
  role: netcup-nano
  server: netcup-nano

when:
  - event: push
    branch: master

steps:
  - name: build-docs
    image: node:26.13.1-alpine3.24@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
    environment:
      pnpm_config_verify_deps_before_run: "false"
    commands:
      - apk add --no-cache git
      - npm install --global pnpm@11.28.9
      - pnpm --filter ./docs... --fail-if-no-match install --frozen-lockfile --prefer-offline
      - pnpm docs:build
      - sh scripts/verify-docs-output.sh docs/.vitepress/dist

  - name: publish-docs
    image: alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    volumes:
      - /var/www/ecoku.zsh.moe:/deploy
    commands:
      - apk add --no-cache coreutils util-linux
      - reruns="$CI_PIPELINE_RERUNS"; test -n "$reruns" || reruns=0; release_id="$CI_COMMIT_SHA-$CI_PIPELINE_NUMBER-$reruns"; sh scripts/publish-docs.sh docs/.vitepress/dist "$release_id"

concurrency:
  limit: 1
  group: ecoku-docs-production
