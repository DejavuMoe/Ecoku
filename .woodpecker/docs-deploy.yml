labels:
  platform: linux/amd64
  backend: docker
  role: netcup-nano
  server: netcup-nano

when:
  - event: push
    branch: master

steps:
  - name: build-docs
    image: node:24.19.0-alpine3.24
    commands:
      - apk add --no-cache git
      - npm install --global pnpm@11.24.0
      - pnpm install --frozen-lockfile
      - pnpm docs:build
      - sh scripts/verify-docs-output.sh docs/.vitepress/dist

  - name: publish-docs
    image: alpine:3.24.1
    volumes:
      - /var/www/ecoku.zsh.moe:/deploy
    commands:
      - apk add --no-cache coreutils util-linux
      - reruns="$CI_PIPELINE_RERUNS"; test -n "$reruns" || reruns=0; release_id="$CI_COMMIT_SHA-$CI_PIPELINE_NUMBER-$reruns"; sh scripts/publish-docs.sh docs/.vitepress/dist "$release_id"

concurrency:
  limit: 1
  group: ecoku-docs-production
