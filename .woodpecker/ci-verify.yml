labels:
  platform: linux/amd64
  backend: docker
  role: forgejo-local
  server: netcup-rs1000

when:
  - event: push
    branch: master
  - event: pull_request
    branch: master

steps:
  - name: frontend
    image: node:24.19.0-alpine3.24
    commands:
      - apk add --no-cache git
      - npm install --global pnpm@11.24.0
      - pnpm install --frozen-lockfile
      - pnpm verify:client
      - pnpm verify:admin
      - pnpm docs:build
      - sh scripts/verify-docs-output.sh docs/.vitepress/dist

  - name: server
    image: golang:1.27.0-alpine3.24
    directory: server
    commands:
      - go test -count=1 ./...
      - go vet ./...
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/ecoku-server .
