labels:
  platform: linux/arm64
  backend: docker
  role: oracle-toronto
  server: oracle-toronto

when:
  event: tag
  ref: refs/tags/v*

steps:
  - name: publish-arm64
    image: woodpeckerci/plugin-docker-buildx:6.1.0
    privileged: true
    settings:
      registry:
        from_secret: forgejo_registry
      repo:
        from_secret: forgejo_image
      username:
        from_secret: forgejo_registry_user
      password:
        from_secret: forgejo_registry_token
      dockerfile: Dockerfile
      platforms: linux/arm64
      tag: ${CI_COMMIT_TAG}-arm64
      # Keep a separate cache per platform so concurrent native builds never
      # overwrite one another's registry cache manifest.
      cache_images:
        - git.via.moe/dejavu/ecoku:buildcache-arm64
      buildkit_oci_max_parallelism: 1
      build_args:
        - ECOKU_VERSION=${CI_COMMIT_TAG}
        - ECOKU_REVISION=${CI_COMMIT_SHA}
        - ECOKU_SOURCE=${CI_REPO_URL}
      pull_image: true
      provenance: mode=max

depends_on:
  - validate-release-tag

concurrency:
  limit: 1
  group: ecoku-image-arm64
