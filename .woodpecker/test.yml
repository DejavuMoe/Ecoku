labels:
  platform: linux/amd64
  backend: docker
  role: forgejo-local
  server: netcup-rs1000

when:
  event: [push, pull_request, tag, manual]

steps:
  - name: frontend
    image: node:24.18.0-alpine3.24
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm verify:client
      - pnpm verify:admin

  - name: server
    image: golang:1.26.5-alpine3.24
    directory: server
    commands:
      - go test -count=1 ./...
      - go vet ./...
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/ecoku-server .

  - name: validate-release-tag
    image: alpine:3.24.1
    commands:
      - 'echo "$${CI_COMMIT_TAG}" | grep -Eq "^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$$"'
      - 'grep -Fx "$${CI_COMMIT_TAG#v}" VERSION'
      - 'grep -Fx "    image: \"git.via.moe/dejavu/ecoku:$${CI_COMMIT_TAG}\"" compose.yaml'
      - '! grep -Fq "ECOKU_VERSION" compose.yaml'
    when:
      event: tag
