labels:
  platform: linux/amd64
  backend: docker
  role: forgejo-local
  server: netcup-rs1000

when:
  - event: push
    branch: master
  - event: pull_request
    branch: master
  - event: manual

steps:
  - name: frontend
    image: node:24.18.0-alpine3.24
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm verify:client
      - pnpm verify:admin

  - name: server
    image: golang:1.26.5-alpine3.24
    directory: server
    commands:
      - go test -count=1 ./...
      - go vet ./...
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/ecoku-server .
